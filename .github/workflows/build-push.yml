name: Build and Push to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: leakaairegistery.azurecr.io
          username: leakaairegistery
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          cd backend
          docker build -t leakaairegistery.azurecr.io/leaka-api:latest .
          docker push leakaairegistery.azurecr.io/leaka-api:latest
